<script src="src/Animator.js"></script>
<script src="src/ClubBalance.js"></script>
<script src="src/Draw.js"></script>
<script src="src/Hands.js"></script>
<script src="src/HeadBounce.js"></script>
<script src="src/Juggler.js"></script>
<script src="src/Prop.js"></script>
<script src="src/Props.js"></script>
<script src="src/Throw.js"></script>

<script>

			let options = {
				fps: 60,
				throwsPerSecond: 2,
				exportGif: false,
				//backgroundColour: '#FFFFFF',
				controls: false,
				debug: false,
			};
			
			let animator;

// Frontend
document.write("<canvas id='stage' width='280' height='640' style='background: rgba(0,0,0,0);'></canvas>");

// Create a client with our options
const client = new tmi.client(opts);

// Register our event handlers (defined below)
client.on('connected', onConnectedHandler);

// Connect to Twitch:
client.connect();

// Start animator with predefined siteswap
	animator = new SiteswapJS("stage", "3", options);
	animator.start();

// Called every time the bot connects to Twitch chat
function onConnectedHandler (addr, port) {
  console.log(`* Connected to ${addr}:${port}`);
}

	//Siteswap command and emote handling
client.on('message', (channel, tags, message, self) => {
	  if (self) return;  // Ignore own messages to avoid loops

	  // Emote handling
	if (tags.emotes !== null) {
	    const emoteID = Object.keys(tags.emotes)[0];
		propImage.src = 'https://static-cdn.jtvnw.net/emoticons/v2/' + emoteID + '/default/dark/2.0';
	    // Optional: update animator if you want to change prop when emote appears
	    // For example, you might reset the animator with new options here if suitable
	}
				
	  if (message[0] !== '!') return;  // Only proceed for commands
	  const parameters = message.slice(1).split(' ').filter(n => n);
	  const command = parameters.shift().toLowerCase();

	  if (command === 'ss') {
        const siteswap = parameters[0];
	    const propType = parameters[1] || 'i';
	    const options = { propType };
        try {
            const hands = new Hands(siteswap);
            if (!hands.valid) {
                client.say(channel, `Invalid siteswap NotLikeThis`);
                return;
            }
        } catch (e) {
            client.say(channel, `Invalid siteswap NotLikeThis`);
            return;
        }

        if (animator) {
            animator.stop();
        }
	    animator = new SiteswapJS('stage', siteswap, options);
			animator.start();
    }
});
</script>
